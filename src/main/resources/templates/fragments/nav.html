<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav(code, active)" class="room-nav">
    <a th:href="@{/room/{code}(code=${code})}"
       th:classappend="${active == 'dashboard'} ? 'active' : ''">대시보드</a>
    <a th:href="@{/room/{code}/calendar(code=${code})}"
       th:classappend="${active == 'calendar'} ? 'active' : ''">캘린더</a>
</nav>
</body>
</html>
