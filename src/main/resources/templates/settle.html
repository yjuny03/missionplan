<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${room.name} + ' 정산'">정산</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1 th:text="${room.name}"></h1>

<div th:replace="~{fragments/nav :: nav(${room.inviteCode})}"></div>

<div class="cycle-nav">
    <a th:href="@{/room/{code}/settle(code=${room.inviteCode}, start=${prevStart})}">이전 주기</a>
    <span th:text="${cycleStart} + ' ~ ' + ${cycleEnd} + ' 정산'"></span>
    <a th:href="@{/room/{code}/settle(code=${room.inviteCode}, start=${nextStart})}">다음 주기</a>
</div>

<div th:if="${!hasPartner}">
    <p>아직 팀원이 참여하지 않아 정산할 수 없습니다.</p>
</div>

<div th:if="${hasPartner}">
    <div class="settlement-summary">
        <div class="settlement-card" th:each="s : ${settlements}">
            <div th:text="${s.nickname}"></div>
            <div class="amount" th:text="${s.total} + '원'"></div>
        </div>
    </div>

    <p class="settlement-result" th:if="${tie}">두 사람 모두 같은 금액입니다. 정산 없이 각자 회수합니다.</p>
    <p class="settlement-result" th:if="${!tie}"
       th:text="'총 ' + ${total} + '원 → ' + ${recipientNickname} + ' 수령'"></p>

    <div th:each="s : ${settlements}">
        <h2 th:text="${s.nickname} + ' 내역'"></h2>
        <ul>
            <li th:each="item : ${s.lateItems}">
                <span th:text="${item.title}"></span>
                <span class="penalty-badge"
                      th:text="${item.daysLate} + '일 × 1,000 = ' + ${item.penaltyWon} + '원'"></span>
            </li>
            <li th:if="${#lists.isEmpty(s.lateItems)}">밀린 항목이 없습니다.</li>
        </ul>
    </div>
</div>
</body>
</html>
