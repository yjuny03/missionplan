<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>미션플랜</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>미션플랜</h1>

<p th:if="${error}" th:text="${error}" class="error"></p>

<section class="accent-green">
    <h2>방 만들기</h2>
    <form th:action="@{/rooms}" method="post">
        <label>방 이름 <input type="text" name="roomName" required></label>
        <label>내 닉네임 <input type="text" name="nickname" required></label>
        <button type="submit" class="btn-primary">만들기</button>
    </form>
</section>

<section class="accent-blue">
    <h2>초대코드로 참여</h2>
    <form th:action="@{/rooms/join}" method="post">
        <label>초대코드 <input type="text" name="inviteCode" required></label>
        <label>내 닉네임 <input type="text" name="nickname" required></label>
        <button type="submit" class="btn-primary">참여하기</button>
    </form>
</section>
</body>
</html>
