<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${room.name}">오늘</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1 th:text="${room.name}"></h1>
<p class="invite-code">초대코드: <strong th:text="${room.inviteCode}"></strong> (팀원에게 이 코드를 전달하세요)</p>

<div th:replace="~{fragments/nav :: nav(${room.inviteCode})}"></div>

<p th:if="${error}" th:text="${error}" class="error"></p>

<h2>내 미션</h2>
<form id="mission-title-form" th:action="@{/room/{code}/missions(code=${room.inviteCode})}" method="post">
    <input type="text" name="title" placeholder="미션 내용" required>
    <button type="submit" class="btn-primary">추가</button>
</form>

<ul>
    <li th:each="mission : ${myMissions}">
        <form th:action="@{/room/{code}/missions/{id}/toggle(code=${room.inviteCode},id=${mission.id})}"
              method="post" style="display:inline">
            <button type="submit" th:classappend="${mission.done} ? 'btn-undo' : 'btn-done'"
                    th:text="${mission.done} ? '완료 취소' : '완료로 표시'"></button>
        </form>
        <span class="mission-title" th:classappend="${mission.done} ? 'done' : ''" th:text="${mission.title}"></span>
        <span th:if="${mission.penaltyWon > 0}" class="penalty-badge"
              th:text="${mission.penaltyWon / 1000} + '일 밀림 · ' + ${mission.penaltyWon} + '원'"></span>
    </li>
    <li th:if="${#lists.isEmpty(myMissions)}">등록된 미션이 없습니다.</li>
</ul>

<div th:if="${partner != null}">
    <h2 th:text="${partner.nickname} + '님 오늘 현황'"></h2>
    <ul>
        <li th:each="mission : ${partnerMissions}">
            <input type="checkbox" th:checked="${mission.done}" disabled>
            <span class="mission-title" th:classappend="${mission.done} ? 'done' : ''"
                  th:text="${mission.title}"></span>
        </li>
        <li th:if="${#lists.isEmpty(partnerMissions)}">아직 등록한 미션이 없습니다.</li>
    </ul>
</div>
<div th:if="${partner == null}">
    <p>아직 팀원이 참여하지 않았습니다. 위 초대코드를 전달해보세요.</p>
</div>
</body>
</html>
