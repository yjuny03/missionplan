<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${room.name} + ' 주간 보드'">주간 보드</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1 th:text="${room.name}"></h1>

<div th:replace="~{fragments/nav :: nav(${room.inviteCode})}"></div>

<div class="cycle-nav">
    <a th:href="@{/room/{code}/week(code=${room.inviteCode}, start=${prevStart})}">이전 주</a>
    <span th:text="${cycleStart} + ' ~ ' + ${cycleEnd}"></span>
    <a th:href="@{/room/{code}/week(code=${room.inviteCode}, start=${nextStart})}">다음 주</a>
</div>

<p th:if="${error}" th:text="${error}" class="error"></p>

<table>
    <tr>
        <td></td>
        <td th:each="cell : ${cells}">
            <a th:href="@{/room/{code}/week(code=${room.inviteCode}, start=${cycleStart}, day=${cell.date})}"
               th:text="${cell.dayLabel}"></a>
        </td>
    </tr>
    <tr>
        <td th:text="${me.nickname}"></td>
        <td th:each="cell : ${cells}">
            <span th:if="${!cell.future}" th:text="${cell.myDone} + '/' + ${cell.myTotal}"></span>
            <span th:if="${cell.future}">–</span>
        </td>
    </tr>
    <tr th:if="${partner != null}">
        <td th:text="${partner.nickname}"></td>
        <td th:each="cell : ${cells}">
            <span th:if="${!cell.future}" th:text="${cell.partnerDone} + '/' + ${cell.partnerTotal}"></span>
            <span th:if="${cell.future}">–</span>
        </td>
    </tr>
</table>

<div th:if="${selectedDay != null}">
    <h2 th:text="${selectedDay}"></h2>

    <h3 th:text="${me.nickname}"></h3>
    <form id="mission-title-form" th:action="@{/room/{code}/week/missions(code=${room.inviteCode})}" method="post">
        <input type="hidden" name="start" th:value="${cycleStart}">
        <input type="hidden" name="day" th:value="${selectedDay}">
        <input type="text" name="title" placeholder="이 날짜에 미션 추가" required>
        <button type="submit" class="btn-primary">추가</button>
    </form>
    <ul>
        <li th:each="mission : ${selectedDayMyMissions}">
            <input type="checkbox" th:checked="${mission.done}" disabled>
            <span class="mission-title" th:classappend="${mission.done} ? 'done' : ''"
                  th:text="${mission.title}"></span>
        </li>
        <li th:if="${#lists.isEmpty(selectedDayMyMissions)}">등록된 미션이 없습니다.</li>
    </ul>

    <div th:if="${partner != null}">
        <h3 th:text="${partner.nickname}"></h3>
        <ul>
            <li th:each="mission : ${selectedDayPartnerMissions}">
                <input type="checkbox" th:checked="${mission.done}" disabled>
                <span class="mission-title" th:classappend="${mission.done} ? 'done' : ''"
                      th:text="${mission.title}"></span>
            </li>
            <li th:if="${#lists.isEmpty(selectedDayPartnerMissions)}">등록된 미션이 없습니다.</li>
        </ul>
    </div>
</div>
</body>
</html>
